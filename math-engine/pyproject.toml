[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "forma-math-engine"
version = "1.0.0"
description = "Deterministic question generation engine for Forma"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sympy>=1.12",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "hypothesis>=6.80",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
