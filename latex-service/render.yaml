# Render Blueprint for the LaTeX compile microservice. Paths below are
# written relative to the repo root (not to this file's own location in
# latex-service/) - that's how Render's dockerfilePath/dockerContext are
# documented to resolve regardless of where render.yaml itself lives, so
# this stays correct even though the file sits in this subfolder rather
# than the repo root, per how it was asked to be placed.
#
# plan: free - deliberate choice (2026-08-20) so the Render Blueprint flow
# doesn't require payment info, overriding this file's earlier "leave it
# unset, pick a real plan in the dashboard" stance. Known tradeoff, not
# silently accepted: Render's free tier is ~512MB RAM/shared CPU and
# spins down after 15 minutes idle (the next request pays a cold start on
# top of the LuaLaTeX compile itself), and this image runs a fairly heavy
# TeX Live install (texlive-fonts-extra, texlive-science, etc - see the
# Dockerfile's own "broad, not minimal" comment) with MAX_CONCURRENT=3
# concurrent lualatex processes (src/server.ts) - 3 real compiles at once
# on 512MB is a genuine OOM risk, not just a slow-cold-start one. Upgrade
# to at least Standard the moment payment info stops being the blocker.
services:
  - type: web
    name: forma-latex-service
    runtime: docker
    dockerfilePath: ./latex-service/Dockerfile
    dockerContext: ./latex-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # Prompted for during Blueprint creation (sync: false = never
      # committed here). Must match LATEX_COMPILE_SECRET in Vercel exactly.
      - key: LATEX_COMPILE_SECRET
        sync: false
